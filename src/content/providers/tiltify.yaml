content:
  summary: "Tiltify supports digital, livestream, gaming, fitness, charity, and personal fundraising campaigns."
  how_it_works: "A fundraiser selects an approved charity or creates a verified personal campaign, builds a shareable page, adds interactive tools such as milestones or polls, and can raise through streaming, fitness, teams, video, social, or in-person outreach."
  best_for:
    - "Charities, creators, gaming communities, teams, and individuals seeking interactive digital fundraising and livestream integrations."
  considerations:
    - "Charity and personal programs have different eligibility, money flow, geography, and timing."
    - "Charity fees vary by plan and processor; personal transfers requiring currency conversion add 1–2%."
