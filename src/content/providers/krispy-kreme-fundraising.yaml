content:
  summary: "Krispy Kreme Fundraising offers pre-sold, one-day inventory, and digital-coupon doughnut fundraisers."
  how_it_works: "A group selects a participating shop and either pre-sells local orders, buys fresh product for a one-day sale, or shares a Digital Dozens link for emailed coupon redemption."
  best_for:
    - "Schools, charities, teams, and community causes with access to a participating Krispy Kreme shop or supporters who can redeem Digital Dozens."
  considerations:
    - "Local assortment, product cost, delivery, and pricing vary by participating shop."
    - "The one-day format creates inventory risk; Digital Dozens redemption is restricted to participating dedicated U.S. shops."
