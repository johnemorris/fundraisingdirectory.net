content:
  summary: "Pledge It is a subscription fundraising suite with peer-to-peer, per-unit pledges, events, endurance, sponsorships, auctions, raffles, and donation tools."
  how_it_works: "An eligible beneficiary connects Stripe, creates campaigns or events, recruits participants or sponsors, and tracks donations, pledges, activity, teams, registrations, sponsor packages, and reporting in one platform."
  best_for:
    - "U.S. nonprofits and other eligible beneficiaries running activity challenges, endurance events, peer-to-peer campaigns, or events with sponsor packages."
  considerations:
    - "A paid subscription and Stripe processing fees apply."
    - "Flat gifts, performance pledges, and sponsorship sales have different processing and settlement flows."
