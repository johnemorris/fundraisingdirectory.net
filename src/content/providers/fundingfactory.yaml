content:
  best_for:
    - "U.S. groups with access to a recurring stream of qualifying printer cartridges and volunteers or businesses able to consolidate shipments."
  considerations:
    - "The qualifying list and per-item values change, and unlisted or damaged items do not earn credit."
    - "Shipping rules matter because an underfilled box using a prepaid label may create a deduction."
  summary: "FundingFactory converts qualifying used printer cartridges into cash for U.S. schools, nonprofits, churches, troops, and community groups."
  how_it_works: "A group registers a Cause, recruits community or business supporters to collect accepted toner and inkjet cartridges, ships the items to FundingFactory, tracks credits online, and requests a check after reaching the payout minimum."
