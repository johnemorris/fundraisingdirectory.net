  notes: "Available only at participating U.S. Panera Bread bakery-cafes (1,922 participating locations listed across 48 states and D.C. at verification). Participation, available dates, standard give-back percentage (20% or 25%), minimum sales threshold ($100–$150), and participation in the December 1–21, 2026 30% promotion vary by individual bakery-cafe and must be verified per location."
  scope:
    - "local"
content:
  best_for:
    - "Tax-exempt 501(c)(3) schools, PTOs/PTAs, sports teams, youth groups, faith groups, and local nonprofits near a participating U.S. Panera Bread bakery-cafe."
  considerations:
    - "Participation, standard give-back rates (20% or 25%), minimum net sales thresholds ($100–$150), and availability of the December 1–21, 2026 30% promotion are location-specific and must be verified for the chosen bakery-cafe."
    - "Only tax-exempt 501(c)(3) organizations with valid W-9/tax documentation qualify, and groups are limited to one event every 30 days."
    - "Gift cards, catering orders, retail items, third-party delivery orders, and any event where flyers are distributed on or near cafe premises do not qualify."
  summary: "Panera Bread Fundraising lets approved 501(c)(3) organizations host local bakery-cafe fundraising nights that return 20%–25% of qualifying net sales (or 30% during the December 1–21, 2026 promotional window at participating cafes) once a $100–$150 minimum sales threshold is met."
  how_it_works: "An eligible tax-exempt organization selects a participating U.S. Panera Bread bakery-cafe, submits a request and W-9, promotes the provided flyer and online promo code to supporters, and receives a mailed check after qualifying in-cafe and online orders meet the cafe's minimum sales threshold."
