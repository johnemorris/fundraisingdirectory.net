    economics:
      status: "known"
      arrangements:
        - type: "upfront-cost"
          value:
            kind: "amount"
            amount: 0
            currency: "USD"
          basis: "Submitting a fundraising request and hosting an approved bakery-cafe event"
          conditions:
            - "The event request is approved by Panera Bread or the participating franchisee"
          caveats:
            - "The organization is responsible for its own flyer printing and advertising expenses"
        - type: "restaurant-give-back"
          value:
            kind: "percentage-range"
            minimum: 20
            maximum: 25
          basis: "Total net food and beverage sales from qualifying supporter orders during the registered event"
          conditions:
            - "The bakery-cafe's minimum net sales requirement ($100–$150 depending on location) is met"
            - "Supporters present the physical or digital event flyer in cafe or enter the event promo code for eligible online/app orders"
          caveats:
            - "Whether a location donates 20% or 25% of net sales is determined by the selected bakery-cafe and shown during event registration"
            - "Net sales exclude taxes, tips, delivery and similar fees, discounts, gift card purchases, catering orders, retail items, and orders placed on third-party delivery sites"
          geographic_restriction:
            countries:
              - "US"
            location_participation_required: true
            notes: "Applies at participating U.S. bakery-cafes; exact standard rate (20% or 25%) varies by cafe location."
        - type: "restaurant-give-back"
          value:
            kind: "percentage"
            percent: 30
          basis: "Total net food and beverage sales from qualifying supporter orders during an approved December 1–21, 2026 promotional event"
          conditions:
            - "The event is scheduled at a participating U.S. bakery-cafe offering the December 1–21, 2026 30% special offer"
            - "The event generates at least $150 in qualifying net sales"
            - "Supporters show the event flyer in cafe or apply the event promo code on eligible online/app orders"
          caveats:
            - "Limited-time promotional rate valid only for events held December 1–21, 2026 at participating bakery-cafes; standard 20%–25% location rates apply outside this window or at locations not offering the promotion"
            - "Requires booking at least 10 days in advance on participating location schedules; gift cards, catering, retail items, and third-party delivery orders are excluded"
          effective_window:
            start_date: "2026-12-01"
            end_date: "2026-12-21"
          geographic_restriction:
            countries:
              - "US"
            location_participation_required: true
            notes: "Offered only at participating U.S. bakery-cafes for events between December 1 and December 21, 2026; verify availability on the specific cafe's fundraising page."
        - type: "minimum-sales"
          value:
            kind: "amount-range"
            minimum: 100
            maximum: 150
            currency: "USD"
          basis: "Total qualifying net food and beverage sales per fundraising event"
          conditions:
            - "Minimum net sales threshold must be met for the organization to receive a donation check"
          caveats:
            - "Standard events require $100 to $150 in qualifying net sales depending on the bakery-cafe location; the December 1–21, 2026 30% promotional offer requires $150 in qualifying net sales"
      notes:
        - "Panera Bread also participates in third-party gift-card (scrip) fundraising through RaiseRight and UnitedScrip, which is administered separately from bakery-cafe fundraiser nights."
    requirements:
      status: "known"
      legal_status:
        - "501c3"
        - "tax-exempt"
      age_range: null
      grade_range: null
      participation_requirements:
        - "The applying organization must be a tax-exempt 501(c)(3) organization and upload a completed W-9 or acceptable tax-exempt documentation with its registration."
        - "The organizer must verify that the chosen U.S. bakery-cafe participates, confirm the cafe's specific give-back rate and minimum sales requirement during registration, and receive a confirmation email accepting the request."
        - "Supporters dining in cafe must show a physical or digital copy of the event flyer to the cashier, and supporters ordering online or in the Panera app must enter the flyer promo code before payment."
      minimum_group_size: null
      minimum_order: null
      minimum_sales:
        kind: "amount-range"
        minimum: 100
        maximum: 150
        currency: "USD"
      other_restrictions:
        - "Tax-exempt organizations are limited to one fundraising event every 30 days at participating bakery-cafes (subject to location rules and past event success)."
        - "Distributing flyers in or near the participating bakery-cafe during the event voids the offer, and issuing a local media press release requires Panera Bread's prior written approval."
        - "Gift card purchases, catering orders, retail merchandise, and orders placed through third-party delivery sites are excluded from qualifying net sales."
      editorial_summary: "Restricted to tax-exempt 501(c)(3) organizations with valid W-9/tax documentation; participation, rates (20%–25% standard or 30% December 1–21, 2026 promo), and $100–$150 sales minimums must be verified per bakery-cafe location."
    timing:
      status: "known"
      setup_lead_time:
        minimum:
          value: 2
          unit: "weeks"
        maximum:
          value: 3
          unit: "weeks"
      campaign_duration:
        exact:
          value: 4
          unit: "hours"
      fulfillment_time: null
      funds_available_time:
        maximum:
          value: 7
          unit: "business-days"
      payout_time:
        minimum:
          value: 45
          unit: "business-days"
        maximum:
          value: 60
          unit: "business-days"
      payout_schedules: []
      notes:
        - "Panera asks organizations to book at least 2–3 weeks in advance (some participating location formats set a 10-to-21-day cutoff), and event requests are reviewed within 10 business days."
        - "Standard in-cafe fundraising hours are 4:00 p.m. to 8:00 p.m., while eligible online and mobile orders placed using the event promo code count all day on the scheduled event date."
        - "Event sales results are emailed within 7 business days. The FAQ states that checks arrive within 45 business days in the step-by-step overview and 45–60 business days in the check-delivery FAQ, while the Terms & Conditions state approximately 45 days after the event."
    logistics:
      status: "known"
      notes:
        - "Organizers search for a participating bakery-cafe on the Panera Fundraising portal (powered by DonationScout) and receive downloadable flyers and social media assets once approved; organizers do not need to be present on site during the event."
        - "If an approved event is at a franchisee bakery-cafe, the organization coordinates directly with the participating franchisee, and cancellations are requested at least 72 hours before the event."
        - "If an eligible online Rapid Pick-Up or first-party delivery order is missing from the donation calculation, the organization must submit transaction receipts within 5 business days of receiving the donation."
