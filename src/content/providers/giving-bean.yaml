content:
  summary: "Giving Bean offers coffee and tea fundraising through local order forms or a direct-ship online store."
  how_it_works: "A group chooses local preorder sales for 40% profit and group distribution, or an online link for 25% on most sales with provider fulfillment and no inventory."
  best_for:
    - "Schools, churches, teams, missions, and community groups seeking coffee and tea products with local or direct-ship fulfillment."
  considerations:
    - "Profit and fulfillment differ by program: 40% with group distribution versus 25% on most direct-ship store items."
    - "Free consolidated shipping requires at least 100 items and delivery to a commercial address."
