content:
  summary: "DonorsChoose connects public-school teachers seeking classroom resources with donors who can fund specific project requests."
  how_it_works: "Teachers submit classroom project requests for review. Donors support published projects, and DonorsChoose purchases and ships funded materials to the teacher."
  best_for:
    - "Eligible United States public-school teachers seeking classroom materials."
    - "Donors who want to support a specific classroom project."
  considerations:
    - "Teacher, school, and project eligibility requirements apply."
    - "The platform fulfills approved classroom resources rather than providing unrestricted funds to a school group."
