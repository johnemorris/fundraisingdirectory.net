  notes: "Help Hope Live supports fundraising campaigns in all 50 states and Puerto Rico. Certain recommended treatments outside the United States may qualify, but the campaign itself remains a U.S./Puerto Rico program."
content:
  summary: "Help Hope Live provides nonprofit-administered medical fundraising for verified transplant, catastrophic injury, and illness expenses in the United States and Puerto Rico."
  how_it_works: "An individual or representative requests help, completes medical and financial verification, works with a coordinator to raise tax-deductible donations through online and community activity, and submits documented requests for eligible expenses held by Help Hope Live."
  best_for:
    - "Individuals and families with significant verified medical need who want sustained community fundraising, tax-deductible gifts, personalized support, and nonprofit administration of the funds."
  considerations:
    - "Acceptance is case-by-case and requires medical and financial documentation plus an active support community."
    - "Funds are restricted to eligible medical and related expenses and are not unrestricted personal income."
