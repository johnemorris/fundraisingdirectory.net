content:
  summary: "Chipotle Community Fundraising offers approved organizations a scheduled restaurant event that returns 25% of qualifying sales after a minimum is met."
  how_it_works: "An eligible organization applies for one restaurant and evening time, promotes the provided event materials, and receives a mailed check after supporters generate qualifying in-person or coded pickup sales."
  best_for:
    - "Schools, teams, clubs, community organizations, and nonprofits with supporters near a participating Chipotle restaurant."
  considerations:
    - "The event must generate at least $150 in qualifying sales."
    - "Only orders at the approved location and time using an eligible participation method count."
