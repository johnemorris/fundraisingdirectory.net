  notes: "This pilot record covers RaiseRight's United States organization offering. Local dining availability is location-dependent; Canadian participation is not represented because the pilot did not establish equivalent current program terms."
content:
  summary: "RaiseRight lets approved organizations earn from participant gift-card purchases, online shopping, local dining, and travel bookings."
  how_it_works: "An organization enrolls, receives a private enrollment code, invites participants, and decides how to allocate earnings generated through eligible purchases and bookings."
  best_for:
    - "Schools, teams, churches, nonprofits, and activity groups seeking year-round earnings tied to routine household spending."
  considerations:
    - "Earning rates, fees, merchant exclusions, fulfillment, and verification timing vary by earning method and brand."
