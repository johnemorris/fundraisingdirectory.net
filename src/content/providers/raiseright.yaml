programs:
  - id: "prog_000015"
    name: "Gift Card Fundraising"
    slug: "gift-card-fundraising"
    url: "https://www.raiseright.com/how-it-works/gift-card-fundraising"
    method: "everyday-passive-fundraising"
    products_services:
      - "gift-cards"
    channels:
      - "online"
      - "hybrid"
    online_ordering: true
    fulfillment:
      - "digital"
      - "direct-to-supporter"
      - "group-distribution"
    inventory_model: "varies"
    upfront_cost: "required"
    ease_to_raise: null
    summary: "Participants buy eGift, physical, or reloadable gift cards at face value and the participating brand returns a published percentage to the organization's program."
    economics_mode: "program-specific"
    economics:
      status: "known"
      arrangements:
        - type: "revenue-share"
          value:
            kind: "variable"
            description: "Brand-specific earnings, with RaiseRight reporting an average of 6% back for gift card fundraising."
          basis: "Face value of eligible gift-card purchases"
          conditions:
            - "The selected brand and gift-card product offer earnings"
          caveats:
            - "Rates vary by brand and can change; bonus events may increase earnings"
        - type: "transaction-fee"
          value:
            kind: "amount"
            amount: 0.29
            currency: "USD"
          basis: "Per online gift-card order paid from a personal bank account when the organization has banking information on file"
          conditions:
            - "ACH payment from a personal bank account"
            - "Organization banking information is on file"
          caveats: []
        - type: "transaction-fee"
          value:
            kind: "amount"
            amount: 0.79
            currency: "USD"
          basis: "Per online gift-card order paid from a personal bank account when the organization does not have banking information on file"
          conditions:
            - "ACH payment from a personal bank account"
            - "Organization banking information is not on file"
          caveats: []
        - type: "transaction-fee"
          value:
            kind: "percentage"
            percent: 1
          basis: "Online gift-card orders paid by debit card"
          conditions: []
          caveats: []
        - type: "transaction-fee"
          value:
            kind: "percentage"
            percent: 3
          basis: "Online gift-card orders paid by credit card"
          conditions: []
          caveats: []
      notes:
        - "RaiseRight states that 100% of earnings go back to the organization; the organization determines how to allocate them."
    requirements:
      status: "known"
      legal_status: []
      age_range: null
      grade_range: null
      participation_requirements:
        - "The organization submits enrollment information and is reviewed for program approval."
        - "The organization configures payment details and determines how earnings are allocated."
        - "Participants join with the organization's confidential enrollment code."
      minimum_group_size: null
      minimum_order: null
      minimum_sales: null
      other_restrictions:
        - "Organization approval generally precedes participant enrollment and ordering."
      editorial_summary: "Enrollment is free; RaiseRight states that organization approval generally takes one to two days."
    timing:
      status: "known"
      setup_lead_time:
        minimum:
          value: 1
          unit: "days"
        typical:
          value: 2
          unit: "days"
        maximum:
          value: 2
          unit: "days"
      campaign_duration:
        open_ended: true
      fulfillment_time: null
      funds_available_time: null
      payout_time: null
      notes: []
      payout_schedules:
        - frequency: "monthly"
          delivery_method: "direct-deposit"
          anchor: null
          conditions:
            - "The organization has a linked bank account"
            - "Qualifying cumulative earnings meet the $20 minimum"
          caveats: []
        - frequency: "monthly"
          delivery_method: "check"
          anchor: null
          conditions:
            - "The organization's payment setup uses an eligible monthly check payout path"
            - "Qualifying cumulative earnings meet the $20 minimum"
          caveats:
            - "Check frequency depends on the organization's payment setup"
        - frequency: "quarterly"
          delivery_method: "check"
          anchor: null
          conditions:
            - "The organization's payment setup uses an eligible quarterly check payout path"
            - "Qualifying cumulative earnings meet the $20 minimum"
          caveats:
            - "Check frequency depends on the organization's payment setup"
    logistics:
      status: "known"
      notes:
        - "eGift cards are delivered to the participant's RaiseRight Wallet."
        - "Eligible physical gift cards can ship to a participant's home or to the organization coordinator for distribution."
        - "Organizations may optionally coordinate participant orders or maintain physical gift-card inventory."
    outcomes:
      - "cash"
    beneficiary_types:
      - "own-organization"
      - "own-project-or-program"
