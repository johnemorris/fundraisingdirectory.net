content:
  summary: "Fundraising.com provides product-sale and online fundraising programs for schools, teams, faith communities, nonprofits, and other community groups in the United States and Canada."
  how_it_works: "Organizers select a program format, choose products, set a campaign timeline, and invite participants to sell in person, collect preorders, or share an online store. Ordering, inventory, and delivery responsibilities depend on the selected program."
  best_for:
    - "Groups that want a choice between direct-sale, preorder, and online-store formats."
    - "Schools, teams, and community organizations running product-based campaigns."
    - "Organizations with supporters in the United States or Canada."
  considerations:
    - "Direct-sale campaigns require more inventory handling than preorder or online-store programs."
    - "Order-taker campaigns require the group to coordinate a campaign window and post-campaign distribution."
    - "Product selection and shipping options vary by program and location."

