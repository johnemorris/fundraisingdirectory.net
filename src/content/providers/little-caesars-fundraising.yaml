content:
  summary: "Little Caesars Fundraising offers brochure, direct-shipped online, and digital Meal Deal product-sale fundraisers."
  how_it_works: "A group chooses a fundraiser format, registers, promotes its store or brochure, and earns item-based profit while fulfillment and payment flow depend on the chosen format."
  best_for:
    - "Schools, teams, and nonprofit groups seeking a recognized prepared-food product fundraiser with group-delivery or direct-to-supporter options."
  considerations:
    - "Official pages checked together conflict on whether standard profit is $6 or $7 per item; confirm current economics before launch."
    - "Brochure campaigns require delivery and group distribution, while online and Meal Deal campaigns use mailed profit checks."
