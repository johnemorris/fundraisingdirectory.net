  summary: "Charleston Wrap offers online and catalog product-sale fundraisers for schools, teams, faith groups, and community organizations."
  how_it_works: "A group launches with an online shop link and optional catalogs. Families place orders, and the direct-to-home program sends each order to the purchasing family."
  best_for:
    - "Schools and parent groups seeking a product catalog with online ordering."
    - "Groups that prefer direct-to-home fulfillment instead of a school sorting night."
  considerations:
    - "Product selection, campaign schedule, shipping, and group terms should be confirmed directly with Charleston Wrap."
    - "The fundraiser depends on families sharing the group link or catalog."
