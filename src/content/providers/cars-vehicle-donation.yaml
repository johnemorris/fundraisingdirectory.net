content:
  best_for:
    - "U.S. nonprofits seeking a year-round vehicle-donation program without building towing, title, auction, donor-service, and tax-document operations."
  considerations:
    - "Revenue varies with vehicle condition, location, sale result, operating expenses, and the partner's percentage agreement."
    - "The sale can take four to twelve weeks or longer before proceeds become available."
  summary: "CARS provides turnkey vehicle-donation fundraising, pickup, sale, compliance, reporting, and proceeds remittance for nonprofit partners."
  how_it_works: "A nonprofit launches a branded donation page and phone line, supporters offer vehicles, CARS evaluates and arranges pickup and sale, operating costs are deducted, and the nonprofit receives its negotiated share of net proceeds with transaction reporting."
