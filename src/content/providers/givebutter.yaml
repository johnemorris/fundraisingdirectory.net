programs:
  - id: "prog_000005"
    name: "Online Fundraising Platform"
    slug: "online-fundraising-platform"
    url: "https://help.givebutter.com/en/articles/1726586-what-is-givebutter-and-how-does-it-work"
    method: "direct-donations"
    products_services:
      - "donation-platform"
      - "crowdfunding-platform"
      - "peer-to-peer-platform"
      - "auction-platform"
      - "event-fundraising-platform"
      - "text-mobile-giving"
    channels:
      - "online"
      - "hybrid"
    online_ordering: null
    fulfillment:
      - "digital"
    inventory_model: "not-applicable"
    upfront_cost: "none"
    ease_to_raise: null
    summary: "Organizations and affiliated fundraisers can run donation forms, crowdfunding pages, peer-to-peer campaigns, events, ticketing, and auctions while managing payments and supporters in one platform."
    economics_mode: "program-specific"
    economics:
      status: "known"
      arrangements:
        - type: "platform-fee"
          value:
            kind: "percentage"
            percent: 0
          basis: "Online transactions on campaigns with optional donor tips enabled"
          conditions:
            - "Optional donor tips remain enabled"
          caveats:
            - "The Givebutter Guarantee has stated exclusions, including payment methods that do not support tips and some imported or legacy recurring plans"
        - type: "platform-fee"
          value:
            kind: "percentage"
            percent: 3
          basis: "Online transactions when optional donor tips are disabled"
          conditions:
            - "Optional donor tips are disabled"
          caveats:
            - "The organization chooses whether donors are asked or required to cover fees or whether the organization absorbs them"
        - type: "processing-fee"
          value:
            kind: "percentage"
            percent: 2.9
          basis: "Card and digital-wallet online transactions"
          conditions: []
          caveats:
            - "A $0.30 per-transaction charge also applies; Givebutter absorbs uncovered processing fees when eligible tips-enabled transactions qualify for the Guarantee"
        - type: "transaction-fee"
          value:
            kind: "amount"
            amount: 0.3
            currency: "USD"
          basis: "Per card, digital-wallet, or ACH online transaction"
          conditions: []
          caveats:
            - "Givebutter absorbs uncovered processing fees when eligible tips-enabled transactions qualify for the Guarantee"
        - type: "processing-fee"
          value:
            kind: "percentage"
            percent: 1.9
          basis: "ACH online transactions for verified nonprofits"
          conditions:
            - "The account is a verified nonprofit"
          caveats:
            - "A $0.30 per-transaction charge also applies"
        - type: "other"
          value:
            kind: "percentage"
            percent: 1.75
          basis: "Optional instant-payout fee"
          conditions:
            - "The account is eligible and selects an instant payout"
          caveats:
            - "Standard payouts are free"
      notes:
        - "Auction payment settings can alter whether the tips-enabled waiver is available; auto-charged auction payments incur the published platform and processing fees."
    requirements:
      status: "known"
      legal_status: []
      age_range: null
      grade_range: null
      participation_requirements:
        - "The campaign operator must connect payout information before publishing and raising funds."
        - "The campaign operator needs a United States bank account, a United States government-issued EIN or Social Security number, and a United States phone number."
        - "The operator must be physically located in the United States or Puerto Rico and satisfy Stripe Connect verification."
      minimum_group_size: null
      minimum_order: null
      minimum_sales: null
      other_restrictions:
        - "Givebutter processes donations in USD; organizations without a United States presence may not be able to complete registration."
        - "Individual personal-fundraising accounts are not supported; individuals may participate on behalf of a verified organization or as team members."
      editorial_summary: "A 501(c)(3) is not stated as universally required, but United States identity, banking, phone, and payout verification requirements apply."
    timing:
      status: "known"
      setup_lead_time: null
      campaign_duration: null
      fulfillment_time: null
      funds_available_time:
        minimum:
          value: 48
          unit: "hours"
        maximum:
          value: 72
          unit: "hours"
      payout_time:
        minimum:
          value: 3
          unit: "business-days"
        maximum:
          value: 5
          unit: "business-days"
      notes:
        - "Eligible instant payouts are typically completed within 60 minutes; eligibility is dynamic."
      payout_schedules: []
    logistics:
      status: "known"
      notes:
        - "Campaign operators connect a United States bank account or debit card through Stripe Connect."
        - "Withdrawals are manually initiated and subject to approval; standard withdrawals are free."
        - "Givebutter offers Form, Page, and Event campaign types; peer-to-peer fundraising is available on Page and Event campaigns, and auctions are available on Page and Event campaigns."
