programs:
  - id: "prog_000005"
    name: "Online Fundraising Platform"
    slug: "online-fundraising-platform"
    url: "https://help.givebutter.com/en/articles/1726586-what-is-givebutter-and-how-does-it-work"
    method: "direct-donations"
    products_services:
      - "donation-platform"
      - "crowdfunding-platform"
      - "peer-to-peer-platform"
      - "auction-platform"
      - "event-fundraising-platform"
      - "text-mobile-giving"
    channels:
      - "online"
      - "hybrid"
    online_ordering: null
    fulfillment:
      - "digital"
    inventory_model: "not-applicable"
    upfront_cost: "none"
    ease_to_raise: null
    summary: "Organizations and affiliated fundraisers can run donation forms, crowdfunding pages, peer-to-peer campaigns, events, ticketing, and auctions while managing payments and supporters in one platform."
    economics_mode: "program-specific"
    economics:
      status: "known"
      arrangements:
        - type: "platform-fee"
          value:
            kind: "percentage"
            percent: 0
          basis: "Online transactions on campaigns with optional donor tips enabled"
          conditions:
            - "Optional donor tips remain enabled"
          caveats:
            - "The Givebutter Guarantee has stated exclusions, including payment methods that do not support tips and some imported or legacy recurring plans"
        - type: "platform-fee"
          value:
            kind: "percentage"
            percent: 3
          basis: "Online transactions when optional donor tips are disabled"
          conditions:
            - "Optional donor tips are disabled"
          caveats:
            - "The organization chooses whether donors are asked or required to cover fees or whether the organization absorbs them"
        - type: "processing-fee"
          value:
            kind: "percentage"
            percent: 2.9
          basis: "Card and digital-wallet online transactions"
          conditions: []
          caveats:
            - "A $0.30 per-transaction charge also applies; Givebutter absorbs uncovered processing fees when eligible tips-enabled transactions qualify for the Guarantee"
        - type: "transaction-fee"
          value:
            kind: "amount"
            amount: 0.3
            currency: "USD"
          basis: "Per card, digital-wallet, or ACH online transaction"
          conditions: []
          caveats:
            - "Givebutter absorbs uncovered processing fees when eligible tips-enabled transactions qualify for the Guarantee"
        - type: "processing-fee"
          value:
            kind: "percentage"
            percent: 1.9
          basis: "ACH online transactions for verified nonprofits"
          conditions:
            - "The account is a verified nonprofit"
          caveats:
            - "A $0.30 per-transaction charge also applies"
        - type: "other"
          value:
            kind: "percentage"
            percent: 1.75
          basis: "Optional instant-payout fee"
          conditions:
            - "The account is eligible and selects an instant payout"
          caveats:
            - "Standard payouts are free"
      notes:
        - "Auction payment settings can alter whether the tips-enabled waiver is available; auto-charged auction payments incur the published platform and processing fees."
    requirements:
      status: "known"
      legal_status: []
      age_range: null
      grade_range: null
      participation_requirements:
        - "The campaign operator must connect payout information before publishing and raising funds."
        - "The campaign operator needs a United States bank account, a United States government-issued EIN or Social Security number, and a United States phone number."
        - "The operator must be physically located in the United States or Puerto Rico and satisfy Stripe Connect verification."
      minimum_group_size: null
      minimum_order: null
      minimum_sales: null
      other_restrictions:
        - "Givebutter processes donations in USD; organizations without a United States presence may not be able to complete registration."
        - "Individual personal-fundraising accounts are not supported; individuals may participate on behalf of a verified organization or as team members."
        - "Registering multiple fundraisers from a single checkout and managing multiple fundraising pages on the same campaign under one login requires registration fundraising with event tickets; minimum-donation registrations and standard P2P sign-ups allow one fundraising page per email address per campaign."
        - "AI Connectors are scoped to a single Givebutter account per connection, have read-only access within the user's permissions, and cannot create, edit, or delete records or move funds."
      editorial_summary: "A 501(c)(3) is not stated as universally required, but United States identity, banking, phone, and payout verification requirements apply."
    timing:
      status: "known"
      setup_lead_time: null
      campaign_duration: null
      fulfillment_time: null
      funds_available_time:
        minimum:
          value: 48
          unit: "hours"
        maximum:
          value: 72
          unit: "hours"
      payout_time:
        minimum:
          value: 3
          unit: "business-days"
        maximum:
          value: 5
          unit: "business-days"
      payout_schedules: []
      notes:
        - "Eligible instant payouts are typically completed within 60 minutes; eligibility is dynamic."
    logistics:
      status: "known"
      notes:
        - "Campaign operators connect a United States bank account or debit card through Stripe Connect."
        - "Withdrawals are manually initiated and subject to approval; standard withdrawals are free."
        - "Givebutter offers Form, Page, and Event campaign types; peer-to-peer fundraising is available on Page and Event campaigns, and auctions are available on Page and Event campaigns."
        - "Through the Givebutter Portal (Fundraising > Manage pages), supporters can oversee every fundraising page they own or manage under one login, view per-campaign page stats, change teams, send up to 10 personalized email or SMS donor invites at a time with automatic reminders, and edit page stories."
        - "When a fundraising page is linked to an event ticket via registration fundraising, assigning the page or reassigning the ticket in the Givebutter Portal transfers both the ticket and the fundraising page to the new person while keeping the original purchaser able to reassign it; an assignee who did not purchase the ticket can also release the page and ticket back to the original buyer."
        - "Users can connect external AI assistants (such as Claude or ChatGPT) via OAuth/MCP for live read-only queries, while account administrators can globally turn off AI Connectors under Settings > AI (immediately disconnecting all active connectors and blocking new ones), audit active connectors by user and tool, disconnect individual or user-wide connections, and toggle AI contact summaries."
    outcomes:
      - "cash"
    capabilities:
      - "donation-forms"
      - "recurring-giving"
      - "crowdfunding-pages"
      - "peer-to-peer-pages"
      - "participant-pages"
      - "leaderboards"
      - "ticketing-registration"
      - "auctions-mobile-bidding"
      - "text-to-give"
      - "qr-giving"
      - "digital-wallets"
      - "donor-crm"
      - "email-marketing"
      - "livestream-integrations"
      - "reporting-analytics"
    beneficiary_types:
      - "own-organization"
      - "own-project-or-program"
      - "community-cause"
    feature_availability:
      - feature: "Givebutter Portal multi-page fundraiser management"
        status: "generally-available"
        notes: "Supporters can register multiple participants in a single ticketed registration-fundraising checkout (with optional email and phone for additional registrants such as children) and oversee all owned or managed pages under one portal login."
      - feature: "Ticket-linked fundraiser page assignment and release transfers"
        status: "generally-available"
        notes: "Assigning a ticketed registration-fundraising page or reassigning its event ticket in the Givebutter Portal moves both the ticket and its linked fundraising page together; assignees can also release a page and ticket back to the purchaser."
      - feature: "Administrator AI Connector controls (Settings > AI)"
        status: "generally-available"
        notes: "Account admins can globally disable OAuth/MCP AI Connectors across the account, inspect active user connections and last-active timestamps, disconnect individual or per-user connectors, and toggle AI contact summaries."
geography:
  scope:
    - "us-nationwide"
  countries:
    - "US"
  states: []
  regions: []
  notes: "Campaign operators must have a United States presence and supported United States or Puerto Rico payout information; donors can contribute from most countries, with donations processed in USD."
content:
  summary: "Givebutter is an online fundraising platform for nonprofits and community organizations, with donation pages, events, auctions, and peer-to-peer tools."
  how_it_works: "An organization creates a campaign or donation form, shares it with supporters, and manages donations, peer-to-peer pages, event tickets, and account settings through Givebutter."
  best_for:
    - "Nonprofits and community organizations that want several online fundraising formats in one platform."
    - "Groups running donation campaigns, events, auctions, or peer-to-peer fundraising."
  considerations:
    - "Available features, payment processing, and pricing can vary by plan and campaign setup."
    - "Multi-page supporter management on a single campaign under one login requires ticketed registration fundraising, and organizations connecting external AI assistants should review Settings > AI controls and third-party AI training policies."
    - "Organizations should confirm current eligibility and terms directly with Givebutter."
