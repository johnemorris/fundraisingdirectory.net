geography:
  scope:
    - "international"
  countries: []
  states: []
  regions: []
  notes: "Bonfire offers international campaign-order shipping subject to country restrictions and customs charges; nonprofit verification in Bonfire is currently limited to United States nonprofits."
content:
  summary: "Bonfire is a custom-merchandise campaign platform that handles printing, payments, shipping, and campaign payouts."
  how_it_works: "An organizer creates a design, chooses products and prices, launches a campaign, and promotes it; Bonfire produces and fulfills sold merchandise and makes campaign profits available after each successful batch."
  best_for:
    - "Groups, nonprofits, and individuals that want custom apparel fundraising without purchasing inventory upfront."
  considerations:
    - "Profit varies with product base cost, price, design, and quantity."
    - "International buyers may owe duties or taxes, and group shipping is limited to the continental United States."
