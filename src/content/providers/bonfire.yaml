          value: 1
          unit: "business-days"
      payout_schedules: []
      notes:
        - "The 2–21-day duration applies to batch campaigns; campaigns may instead run continuously using print on demand. The one-business-day payout time describes PayPal after a payout request."
    logistics:
      status: "known"
      notes:
        - "Bonfire prints after a batch ends or on the next business day for print-on-demand orders. Sellers choose direct-to-buyer, group shipping, or buyer-choice shipping; buyers generally pay shipping."
