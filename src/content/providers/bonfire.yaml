programs:
  - id: "prog_000023"
    name: "Merch Fundraising Campaigns"
    slug: "merch-fundraising-campaigns"
    url: "https://www.bonfire.com/fundraising/nonprofits/"
    method: "product-sales"
    products_services:
      - "apparel-spirit-wear"
