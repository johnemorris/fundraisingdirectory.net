      - "hybrid"
    online_ordering: true
    fulfillment:
      - "direct-to-supporter"
      - "group-distribution"
      - "provider-delivery"
    inventory_model: "no-inventory"
    upfront_cost: "none"
    ease_to_raise: null
    summary: "Organizers design and price custom merchandise, promote an online campaign, and receive the difference between sale price and Bonfire's base cost while Bonfire prints and ships orders."
    economics_mode: "program-specific"
    economics:
      status: "known"
      arrangements:
        - type: "upfront-cost"
          value:
            kind: "amount"
            amount: 0
            currency: "USD"
          basis: "Launching and selling through a Bonfire campaign"
          conditions: []
          caveats: []
        - type: "product-sale-profit"
          value:
            kind: "variable"
            description: "Campaign price minus the product's manufacturing, sourcing, and printing base cost; margins increase with higher quantities"
          basis: "Each product sold"
          conditions:
            - "The organizer sets a sale price above the applicable base cost"
          caveats:
            - "Base cost varies by product, design, and batch quantity"
        - type: "processing-fee"
          value:
            kind: "percentage"
            percent: 8
          basis: "Optional additional contributions at checkout"
          conditions:
            - "Standard campaign donation processing"
          caveats: []
        - type: "processing-fee"
          value:
            kind: "percentage"
            percent: 3.5
          basis: "Optional additional contributions at checkout"
          conditions:
            - "Verified nonprofit campaign"
          caveats: []
        - type: "minimum-payout"
          value:
            kind: "amount"
            amount: 5
            currency: "USD"
          basis: "PayPal payout request"
          conditions: []
          caveats:
            - "Alternative check and ACH payout methods have higher minimums and are eligibility-dependent"
      notes:
        - "Buyers pay shipping separately, so standard campaign shipping is not deducted from campaign profits."
    requirements:
      status: "known"
      legal_status: []
      age_range: null
      grade_range: null
      participation_requirements:
        - "The organizer supplies or creates a design, selects products, sets prices, and promotes the campaign."
      minimum_group_size: null
      minimum_order: null
      minimum_sales: null
      other_restrictions:
        - "United States nonprofit verification and an authorized organization role are required for verified nonprofit perks and direct organization payouts."
      editorial_summary: "Anyone may sell through Bonfire, while verified nonprofit status provides reduced donation fees and nonprofit-specific payout options."
    timing:
      status: "known"
      setup_lead_time: null
      campaign_duration:
        minimum:
