content:
  summary: "Every.org is a nonprofit giving platform for eligible charities, supporting cash, mobile-wallet, stock, cryptocurrency, DAF, IRA, peer-to-peer, matching, and workplace gifts."
  how_it_works: "An eligible nonprofit claims its profile and selects donation methods; supporters give to Every.org and recommend the nonprofit, and Every.org issues the receipt, processes or converts the gift, and disburses an aggregated grant."
  best_for:
    - "Eligible nonprofits seeking one donation surface for cash, mobile payments, stock, crypto, DAF, and IRA gifts without a platform subscription."
    - "Nonprofits and supporters creating peer fundraisers or externally funded matching campaigns."
  considerations:
    - "Every.org is the legal recipient and retains discretion over distributions; recipient eligibility and disbursement setup matter."
    - "Employer matching remains subject to each employer's rules, and automated Teleskope availability is not universal."
    - "Payment-processing and disbursement fees vary even though Every.org charges no platform fee."
