  notes: "GroupRaise is a nationwide discovery platform, but restaurant-meal availability, dates, give-back rates, order channels, eligibility rules, and documentation requirements are determined at the individual restaurant-location level and discovered by address or ZIP code."
content:
  summary: "GroupRaise helps groups request and promote restaurant fundraising meals at participating local restaurant locations."
  how_it_works: "An organizer searches near an address, selects a participating restaurant location, requests an available date, promotes a Meal Page, gathers RSVPs, and receives a donation based on qualifying supporter sales reported by the restaurant."
  best_for:
    - "Groups that can mobilize at least 20 local supporters for a scheduled restaurant meal."
  considerations:
    - "Availability and program rules vary by restaurant location."
    - "The restaurant, not GroupRaise, is financially responsible for reporting and distributing the donation."
