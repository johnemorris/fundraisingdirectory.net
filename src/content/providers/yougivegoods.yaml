content:
  best_for:
    - "Individuals, schools, employee teams, companies, and charities seeking an online goods drive without physical collection bins or organizer-managed shipping."
  considerations:
    - "The program raises new goods rather than unrestricted cash."
    - "Available items and prices are those shown in the platform catalog for the drive."
  summary: "YouGiveGoods is a free online platform for food, school-supply, clothing, hygiene, disaster-relief, and other new-goods drives delivered directly to U.S. charities."
  how_it_works: "An organizer chooses a cause, charity, and requested goods; supporters buy listed items online; the platform tracks progress and handles delivery to the charity."
