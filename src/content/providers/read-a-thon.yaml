content:
  summary: "Read-A-Thon is a dedicated school literacy fundraiser with reading-minute tracking, student fundraising pages, communications, reporting, and optional prize fulfillment."
  how_it_works: "A school chooses a reward model, creates the event, enrolls readers, shares student sponsor pages, tracks minutes and donations, closes the fundraiser, and receives its earned proceeds in two post-event payments."
  best_for:
    - "Schools and PTO/PTAs seeking a short, literacy-aligned, no-product-sale event with participant pages and optional outsourced prizes."
  considerations:
    - "The school receives 75% or 80% depending on who manages student rewards."
    - "Profit is split into two payments so a reserve can cover chargebacks and bad checks."
