content:
  summary: "Zeffy is a fee-free fundraising and donor-management platform for verified nonprofit organizations."
  how_it_works: "An eligible organization verifies its identity and bank account, creates fundraising forms or campaigns, and receives collected funds by scheduled direct deposit while donors may optionally contribute to Zeffy."
  best_for:
    - "Verified nonprofits seeking integrated online, event, auction, and peer-to-peer fundraising tools without platform fees."
  considerations:
    - "Eligibility is restricted by legal status, country, and organization-owned bank account."
    - "Weekly payout cadence is retained in timing notes because the frozen recurring-schedule taxonomy is intentionally limited to pilot-proven monthly and quarterly schedules."
