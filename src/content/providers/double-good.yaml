content:
  summary: "Double Good offers online popcorn fundraisers for schools, teams, and youth-focused organizations through participant Pop-Up Stores."
  how_it_works: "An organizer sets up a fundraiser in the app, invites participants, and participants share individual online stores. Double Good processes orders and ships popcorn to supporters."
  best_for:
    - "Schools, teams, clubs, and youth organizations seeking an online product-sale fundraiser."
    - "Groups that prefer direct-to-supporter shipping instead of handling inventory."
  considerations:
    - "The program centers on popcorn sales and requires participants to share their stores with supporters."
    - "Groups should confirm current campaign timing, eligibility, and terms directly with Double Good."
