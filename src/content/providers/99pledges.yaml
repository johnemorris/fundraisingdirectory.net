content:
  summary: "99Pledges is an online pledge and participant-page platform for school, team, and group fundraisers."
  how_it_works: "An organizer creates a fundraiser, adds participant pages, shares the campaign, records activity results when pledges depend on performance, then closes the fundraiser and requests payment."
  best_for:
    - "Schools, PTOs, teams, and youth groups running fun runs, walkathons, readathons, or participant-led donation drives."
  considerations:
    - "Online donations incur percentage and per-transaction processing charges."
    - "Activity results must be entered before requesting payout for performance-based pledges."
