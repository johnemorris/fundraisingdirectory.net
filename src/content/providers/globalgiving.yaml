content:
  best_for:
    - "Registered nonprofits seeking international reach, vetted-project credibility, corporate and matching opportunities, donor acquisition, training, and multi-country disbursement support."
  considerations:
    - "The fee depends on amount raised, registration country, and donation type, with a 3% processing fee added."
    - "Admission and continued visibility require substantial due diligence and recurring project reporting."
  summary: "GlobalGiving is a vetted international nonprofit fundraising community connecting local projects with individual, corporate, workplace, matching, and grant funding."
  how_it_works: "A nonprofit applies and passes due diligence, publishes one or more projects, raises through project pages and supporter campaigns, reports progress at least quarterly, and receives cleared net funds on the applicable monthly or country-specific schedule."
