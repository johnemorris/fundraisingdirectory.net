    ease_to_raise: null
    summary: "A personal or family support page combining cash fundraising, meal scheduling, gift cards, volunteer and errand coordination, and updates for supporters."
    economics_mode: "program-specific"
    economics:
      status: "known"
      arrangements:
        - type: "upfront-cost"
          value:
            kind: "amount"
            amount: 0
            currency: "USD"
          basis: "Creating and using a Support Registry"
          conditions: []
          caveats: []
        - type: "platform-fee"
          value:
            kind: "amount"
            amount: 0
            currency: "USD"
          basis: "Support Registry tools"
          conditions: []
          caveats: []
        - type: "processing-fee"
          value:
            kind: "percentage"
            percent: 2.7
          basis: "Credit-card processing when the supporter removes the optional RoundUp"
          conditions:
            - "The supporter removes the optional RoundUp contribution at checkout"
          caveats:
            - "SupportNow states that the family receives 100% of the intended donation when the supporter keeps the optional RoundUp that covers processing costs"
        - type: "proceeds"
          value:
            kind: "percentage"
            percent: 100
          basis: "The donor's intended gift"
          conditions:
            - "The donor keeps the optional RoundUp contribution that covers fees"
          caveats: []
      notes:
        - "Supporters can remove the optional RoundUp; when they do, the published 2.7% credit-card processing cost is deducted from the intended gift."
    requirements:
      status: "known"
      legal_status: []
      age_range: null
      grade_range: null
      participation_requirements:
        - "An organizer creates a Support Registry for themselves or a recipient and provides accurate information about the recipient and intended use of contributions."
        - "SupportNow's terms require U.S. residence and accurate account information. They state that users must be at least 18 or over the age of majority in their jurisdiction and separately state that anyone under the local age of majority may use the service only with parent or guardian approval."
      minimum_group_size: null
      minimum_order: null
      minimum_sales: null
      other_restrictions:
        - "Contributions must be used as described on the Support Registry and cannot be exchanged for goods or services."
        - "If an organizer adds a separate recipient, the terms state that the organizer relinquishes control of the contributions to that recipient."
        - "People outside the United States are not authorized to use the service under the reviewed terms."
      editorial_summary: "Designed for U.S. individuals and families coordinating support around illness, disability, caregiving, loss, disaster, birth, or another difficult life event."
    timing:
      status: "known"
      setup_lead_time:
        typical:
          value: 10
          unit: "minutes"
      campaign_duration:
        open_ended: true
      fulfillment_time: null
      funds_available_time: null
      payout_time: null
      payout_schedules: []
      notes:
        - "SupportNow describes a guided fundraiser setup taking about ten minutes and says cash is sent as gifts arrive rather than waiting for the goal. It does not publish one precise universal bank-settlement duration on the reviewed pages. Meal and volunteer timing is selected by the organizer and supporters."
    logistics:
      status: "known"
      notes:
        - "The organizer publishes one support page and specifies cash, meal, gift-card, volunteer, errand, and update needs. Supporters donate, claim dated meal or task slots, or follow updates; the family controls page visibility and the information shared."
        - "SupportNow can display an existing GoFundMe campaign within its broader support options, but the GoFundMe campaign remains a separate third-party fundraiser."
