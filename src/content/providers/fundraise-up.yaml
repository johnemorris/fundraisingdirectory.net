    requirements:
      status: "known"
      legal_status:
        - "nonprofit"
        - "registered-nonprofit"
        - "tax-exempt"
      age_range:
        minimum: 18
      grade_range: null
      participation_requirements:
        - "The organization must be an existing Fundraise Up customer based in the United States, Canada, or the United Kingdom with a connected Stripe account and matching domestic campaign currency (USD, CAD, or GBP)."
        - "The event must take place in the same country as the organization, with an active internet connection and a separate Fundraise Up user account for each person collecting donations."
        - "Compatible hardware is required: NFC-capable iPhone (iPhone XS or newer on iOS 18.7+) or supported Android phone (Android 13+ with NFC), or a tablet (10 inches or larger recommended for Giving Station; iPads and non-NFC tablets require an external Stripe card reader such as Stripe Reader M2 in the US or BBPOS WisePad 3 in Canada and the UK)."
      minimum_group_size: null
      minimum_order: null
      minimum_sales: null
      other_restrictions:
        - "Only an Organization Administrator can enable In-Person Giving on the account."
        - "On iPhone, Apple blocks Tap to Pay for the remainder of the day if a single iPhone is used with more than three organizations within 24 hours."
        - "In Canada and the UK, an external card reader with a keypad/chip slot (BBPOS WisePad 3) is recommended for donations above 100 CAD or 100 GBP, and Canadian contactless taps cannot complete donations above 250 CAD."
      editorial_summary: "Restricted to US, Canadian, and UK organizations operating domestic events in local currency with Stripe Terminal hardware or supported NFC devices."
    timing:
      status: "researched-unknown"
      setup_lead_time: null
      campaign_duration: null
      fulfillment_time: null
      funds_available_time: null
      payout_time: null
      payout_schedules: []
      notes: []
    logistics:
      status: "known"
      notes:
        - "Tap to Donate runs on phones or tablets held by staff or volunteers; Giving Station locks a tablet (8+ inches required, 10+ inches recommended) to a self-serve donation screen with a 4-digit PIN."
        - "In the UK, the app runs in UK English, lists GBP campaigns, collects supporter name and email before payment for UK receipting, and can capture on-screen Gift Aid declarations and mailing addresses; the charity remains responsible for submitting Gift Aid claims to HMRC."
        - "Administrators can assign In-Person Giving Specialists to specific Tap to Donate or Giving Station campaigns and optionally mask saved supporter names, email addresses, and phone numbers in the app."
        - "The app blocks screenshots and screen recording on screens showing supporter personal details, encrypts card data directly to Stripe without storing card numbers on the device, and syncs all gifts and post-payment questions to the Dashboard, exports, and CRM integrations."
    name: "In-Person Giving (Tap to Donate & Giving Station)"
    slug: "in-person-giving"
    url: "https://fundraiseup.com/docs/mobile-app/"
    method: "direct-donations"
    channels:
      - "in-person"
      - "hybrid"
    summary: "Organizations in the United States, Canada, and the United Kingdom use the Fundraise Up mobile app on compatible phones or tablets to collect contactless in-person donations via staffed Tap to Donate or self-serve Giving Station kiosks."
    availability_state: "generally-available"
    geographic_restriction:
      countries:
        - "US"
        - "CA"
        - "GB"
      location_participation_required: false
      notes: "Available only to organizations based in the United States (USD), Canada (CAD), or the United Kingdom (GBP), and the in-person event must take place in the same country as the organization."
    feature_availability:
      - feature: "Tap to Donate and Giving Station in the United Kingdom (GBP with on-screen Gift Aid)"
        status: "generally-available"
        countries:
          - "GB"
        notes: "Launched in November 2026 for UK-registered organizations collecting GBP; captures supporter Gift Aid declarations and mailing addresses in the app while the charity still submits claims to HMRC."
      - feature: "Hide supporter personal details from in-person staff and volunteers"
        status: "generally-available"
        countries:
          - "US"
          - "CA"
          - "GB"
        notes: "Added November 16, 2026; masks saved supporter names, emails, and phone numbers for In-Person Giving Specialists, logs changes in the Audit log, and blocks screenshots and screen recording on personal-detail screens."
    outcomes:
      - "cash"
    capabilities:
