geography:
  countries:
    - "US"
    - "CA"
    - "GB"
  states: []
  regions: []
  notes: "Online giving supports 25+ languages, multiple currencies, and international payment methods (including ACH, Bacs, SEPA, BECS, PAD, cards, wallets, DAFpay, and crypto), while the In-Person Giving mobile app is restricted to domestic events for organizations based in the United States (USD), Canada (CAD), and the United Kingdom (GBP)."
  scope:
    - "us-nationwide"
    - "canada"
    - "international"
content:
  best_for:
    - "Nonprofits seeking conversion-optimized online checkout, recurring giving, or an embedded multi-program Gift Cart catalog without fixed subscription contracts."
    - "Organizations running supporter-driven peer-to-peer campaigns or collecting contactless in-person donations in the US, Canada, or the UK."
  considerations:
    - "DIY Peer-to-Peer fundraising and the AI Coach companion are in Early Access (requiring Customer Success Manager enablement for AI Coach), and P2P walk/run/ride events are announced rather than generally available."
    - "The ~1% effective platform cost is an average after optional donor fee coverage rather than a guaranteed flat rate, and processor or Stripe Terminal fees apply separately."
    - "In-Person Giving is limited to organizations and events in the US, Canada, and the UK, and embedded Checkout Modal users serving European or UK donors must supply their own pre-loading website cookie banner."
  summary: "Fundraise Up is a donor-experience and fundraising platform for nonprofits offering AI-optimized online checkout, multi-item Gift Cart catalogs, Early Access DIY peer-to-peer fundraising with AI Coach, and in-person giving in the US, Canada, and the UK."
  how_it_works: "An eligible nonprofit connects Stripe or PayPal, embeds Fundraise Up Checkout, Elements, or Gift Cart on its website or launches hosted Campaign Pages, P2P campaigns, or mobile In-Person Giving, and manages donations, tributes, privacy consent, and CRM syncs from one Dashboard."
