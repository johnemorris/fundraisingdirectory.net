      participation_requirements:
        - "The organization must register for a Fundraise Up account, connect a supported payment processor such as Stripe or PayPal, and install the Fundraise Up script or use hosted Campaign Pages."
        - "Organizations accepting donations from EU, EEA, or UK supporters through an embedded Checkout Modal must implement a compliant cookie banner on their own website that loads before Fundraise Up's script."
      minimum_group_size: null
      minimum_order: null
      minimum_sales: null
      other_restrictions:
        - "End users must be at least 18 years old and authorized to bind the customer entity."
        - "Gift Cart is designed for charitable program designations, symbolic gifts, and sponsorships rather than physical retail merchandise fulfillment."
      editorial_summary: "Built for nonprofit and tax-exempt organizations with a connected payment processor; website cookie-banner obligations depend on whether checkout is embedded or hosted."
    timing:
      status: "researched-unknown"
      setup_lead_time: null
      campaign_duration: null
      fulfillment_time: null
      funds_available_time: null
      payout_time: null
      payout_schedules: []
      notes: []
    logistics:
      status: "known"
      notes:
        - "Gift Cart embeds a searchable, filterable catalog directly on the nonprofit's website where supporters can add up to 50 gifts with separate amounts, frequencies, and dedications in one checkout, or use Give now for single-gift checkout."
        - "Each gift in Gift Cart can carry its own custom field values (such as appeal or fund codes) via Dashboard or CSV upload, falling back to catalog-level values when unset, and catalogs can include a translatable FAQ block below the gifts."
        - "Tribute giving supports In Honor and In Memory dedications with separate customizable e-cards or organization-fulfilled postal mail notifications, plus Donor Portal self-service."
        - "Checkout supports general or channel-specific marketing consent (including location-detected UK and France checkout opt-out flows) and integrated cookie-consent banners on Campaign Pages and Donor Portal."
    name: "Online Giving Checkout, Campaign Pages, and Gift Cart"
    slug: "online-giving-and-gift-cart"
    url: "https://fundraiseup.com/docs/gift-cart/"
    method: "direct-donations"
    channels:
      - "online"
    summary: "Nonprofits embed conversion-optimized Checkout modals, hosted Campaign Pages, Elements, and the Gift Cart multi-program giving catalog on their websites to accept one-time and recurring donations, tributes, and employer-matched gifts."
    availability_state: "generally-available"
    feature_availability:
      - feature: "Gift Cart multi-program catalog (up to 50 items per checkout)"
        status: "generally-available"
        notes: "Generally available; November 2026 updates added per-gift custom field values (via Dashboard or CSV), embedded translatable FAQ blocks, and dedicated full-page Dashboard gift and sponsorship editing."
      - feature: "Donor Portal and Campaign Page integrated cookie banner"
        status: "generally-available"
        notes: "Automatically displays in jurisdictions requiring cookie consent (such as the EU, UK, Switzerland, California, and Quebec), restricting Donor Portal to strictly necessary cookies until answered and remembering choices for 400 days."
