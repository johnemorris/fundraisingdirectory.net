    summary: "Supporters create individual or team fundraising pages on a nonprofit's behalf—including In Memory, In Honor, custom occasion, and organization-represented campaigns—with automated tribute dedication tracking, optional AI Coach assistance in early access, and embedded galleries and leaderboards."
    availability_state: "early-access"
    feature_availability:
      - feature: "DIY Peer-to-Peer fundraising"
        status: "early-access"
        notes: "Available in early access as a live working product; participants run at least one real campaign and share structured feedback with no contract or extra fee."
      - feature: "AI Coach for individual P2P fundraisers"
        status: "early-access"
        notes: "Available in early access at no additional charge for nonprofits using DIY P2P; defaults to off on new campaigns and must be enabled on the organization's account by its Customer Success Manager before campaign activation."
