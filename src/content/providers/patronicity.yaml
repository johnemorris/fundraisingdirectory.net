  notes: "General project creators may be located in the United States or Canada and contributions can come from anywhere. Matching-grant availability is tied to specific partner geographies, commonly state or local programs in the United States; no location entities are modeled here."
content:
  summary: "Patronicity combines coached civic crowdfunding with partner-specific matching grants for community-led projects."
  how_it_works: "A creator submits a community project, works with a coach to launch a time-limited campaign, gathers online and offline support, and—if enrolled in crowdgranting—earns a partner match after meeting the program's threshold and other requirements."
  best_for:
    - "Community groups, nonprofits, municipalities, small businesses, and local changemakers raising for a visible place-based project."
  considerations:
    - "Personal bills, medical costs, political campaigns, and several other personal-use categories are excluded."
    - "Matching grants are location- and program-specific; a provider-level profile cannot show current ZIP-level availability."
