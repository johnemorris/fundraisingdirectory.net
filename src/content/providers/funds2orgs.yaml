content:
  summary: "Funds2Orgs runs no-upfront-cost shoe-drive fundraisers that pay organizations based on collected shoe weight."
  how_it_works: "A group enrolls with a coach, collects and pairs shoes using supplied materials, coordinates pickup, and receives a weight-based check after warehouse processing."
  best_for:
    - "Schools, teams, churches, nonprofits, and civic groups able to organize a community shoe collection."
  considerations:
    - "The payout rate is program-specific and must be confirmed with a coach."
    - "Collection, packing, storage, and promotion require hands-on group coordination."
