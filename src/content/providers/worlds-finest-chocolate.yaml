    online_ordering: true
    fulfillment:
      - "group-distribution"
      - "provider-delivery"
    inventory_model: "upfront-inventory"
    upfront_cost: "varies"
    ease_to_raise: null
    summary: "Groups order chocolate, distribute inventory to participants, sell it in person, collect proceeds, and retain a published share of product value."
    economics_mode: "program-specific"
    economics:
      status: "known"
      arrangements:
        - type: "product-sale-profit"
          value:
            kind: "tiered"
            tiers:
              - threshold: "Fewer than 200 cases"
                payout:
                  kind: "percentage"
                  percent: 40
              - threshold: "More than 200 cases"
                payout:
                  kind: "percentage"
                  percent: 50
          basis: "Published $80 value per case"
          conditions: []
          caveats:
            - "The official FAQ does not state the profit tier for exactly 200 cases; confirm with a representative before ordering."
        - type: "minimum-order"
          value:
            kind: "quantity"
            amount: 8
            unit: "cases"
          basis: "Total order, with mix-and-match items allowed"
          conditions: []
          caveats: []
        - type: "upfront-cost"
          value:
            kind: "variable"
            description: "Website orders require upfront payment; qualifying representative-assisted groups may receive credit terms and pay after the fundraiser."
          basis: "Order channel and credit qualification"
          conditions:
            - "Credit qualification is determined by World's Finest Chocolate"
          caveats:
            - "Shipping charges and applicable sales tax vary"
      notes:
        - "Under the published tiers, profit is $32 per $80 case below 200 cases and $40 per $80 case above 200 cases."
    requirements:
      status: "known"
      legal_status: []
      age_range: null
      grade_range: null
      participation_requirements:
        - "A group manages product distribution, seller collections, and safe storage."
      minimum_group_size: null
      minimum_order:
        kind: "quantity"
        amount: 8
        unit: "cases"
      minimum_sales: null
      other_restrictions:
        - "Online orders require upfront payment and are not returnable."
        - "Credit terms, return eligibility, and no-upfront-cost qualification depend on organization type and approval."
        - "Public and parochial schools qualify for no-upfront-cost terms only when the school is responsible for the invoice; affiliated groups do not automatically qualify."
      editorial_summary: "An eight-case minimum applies; financial and return terms vary by ordering path and credit approval."
    timing:
      status: "known"
      setup_lead_time:
        minimum:
          value: 1
          unit: "weeks"
        maximum:
          value: 2
          unit: "weeks"
      campaign_duration:
        typical:
          value: 2
          unit: "weeks"
      fulfillment_time:
        minimum:
          value: 5
          unit: "business-days"
        maximum:
          value: 7
          unit: "business-days"
      funds_available_time: null
      payout_time: null
      notes:
        - "Approved credit accounts are typically invoiced on 30-day terms."
      payout_schedules: []
    logistics:
      status: "known"
      notes:
        - "Most orders ship within 5–7 business days; large-volume orders can take longer."
        - "Warm-weather shipments use dry ice and may be delayed in extreme heat."
        - "A recipient should inspect and store temperature-sensitive chocolate promptly in a cool, dry place without refrigeration."
        - "Unopened, undamaged product may be returnable within 60 days only when the order and credit terms qualify; online orders are not returnable."
