content:
  best_for:
    - "Groups and individuals that want custom apparel to raise both money and awareness without buying or storing inventory upfront."
  considerations:
    - "Merchandise orders proceed only after the campaign reaches its displayed print minimum."
    - "Profit varies with the product, design, price, volume, and delivery choice; international duties and taxes are paid by the recipient."
  summary: "Custom Ink Fundraising provides risk-limited custom-apparel campaigns with hosted sales, optional donations, print-on-demand production, delivery, and beneficiary disbursement."
  how_it_works: "The organizer designs merchandise and selects its price, goal, beneficiary, close date, and delivery options; supporters order or donate online; Custom Ink prints qualifying orders, handles fulfillment, and sends net funds after the campaign."
