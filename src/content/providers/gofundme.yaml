content:
  summary: "GoFundMe is an online crowdfunding platform for individuals, families, medical needs, groups, community causes, and eligible nonprofit fundraising."
  how_it_works: "An organizer creates a fundraiser with a story and goal, shares the campaign with supporters, posts updates, thanks donors, and completes the steps required to transfer funds."
  best_for:
    - "Individuals and families raising donations for medical costs, emergencies, memorials, or another specific need."
    - "Groups and eligible nonprofits seeking a public crowdfunding campaign."
    - "Organizers prepared to tell their story and actively share a public campaign."
  considerations:
    - "GoFundMe states that it does not find donors for organizers; campaign outreach remains the organizer's responsibility."
    - "Transaction fees, eligibility, and transfer requirements vary and should be reviewed for the organizer's country and fundraiser type."
